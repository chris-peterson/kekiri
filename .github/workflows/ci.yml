name: CI

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # 8.0.x supplies the runtime the projects target; 10.0.x supplies the SDK, whose
          # Microsoft.Testing.Platform mode of `dotnet test` is what the test project runs under.
          dotnet-version: |
            8.0.x
            10.0.x

      # Configuration is passed per-command rather than as a job-level env var: the
      # Microsoft.Testing.Platform mode of `dotnet test` doesn't read it from the environment,
      # so it looked for test executables under bin/Debug while the build wrote bin/Release.
      - name: Build
        run: dotnet build -c Release

      - name: Test with coverage
        run: python3 scripts/coverage.py

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('artifacts/coverage/summary.md') != '' }}
        run: cat artifacts/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
