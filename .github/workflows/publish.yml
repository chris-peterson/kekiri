name: Publish

on:
  release:
    types: [ published ]

jobs:
  publish:
    if: github.repository == 'chris-peterson/kekiri'

    runs-on: ubuntu-latest

    env:
      Configuration: Release
      PackageReleaseNotes: ${{ github.event.release.body }}
      PackageReleaseTag: ${{ github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: 6.0.x

      - name: Build
        run: dotnet build
        
      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY is not set on the nuget.org environment"
            exit 1
          fi
          # Quoted so NuGet expands the pattern; bash leaves ** unexpanded without globstar
          dotnet nuget push "**/*.nupkg" --skip-duplicate --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

    environment:
      name: nuget.org
      url: https://nuget.org/packages/Kekiri
