name: Publish

on:
  workflow_dispatch:
    inputs:
      notes:
        description: What changed in this release
        required: false
        type: string

jobs:
  publish:
    if: github.repository == 'chris-peterson/kekiri'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      PackageReleaseNotes: ${{ inputs.notes }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The release name is derived from the tags already in the repo.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      # Each package carries its own <Version>, so a release names the day it shipped. A second
      # release on the same day takes a .2, a third a .3.
      - name: Name the release
        id: name
        run: |
          base=$(date -u +%Y-%m-%d)
          tag=$base
          n=1
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
            n=$((n + 1))
            tag="$base.$n"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack -c Release --no-build --output artifacts

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY is not set on the nuget.org environment"
            exit 1
          fi
          dotnet nuget push 'artifacts/*.nupkg' --skip-duplicate --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

      # After the push, so a tag exists only for packages that reached nuget.org.
      - name: Tag what shipped
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.name.outputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: gh release create "$TAG" artifacts/*.nupkg --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES"

    environment:
      name: nuget.org
      url: https://nuget.org/packages/Kekiri
